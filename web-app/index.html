<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#CFEFFB" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iPhone/iPad: open full screen when added to the home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vinu &amp; Veti" />
    <title>Vinu Veti - AR Book Explorer</title>
    <meta name="description" content="Vinu Veti - Aplikasi Augmented Reality cerdas penjelajah buku interaktif dengan proyeksi objek 3D interaktif di atas kamera latar nyata." />
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }

  </head>
  <body style="margin:0;padding:0;background-color:#CFEFFB;overflow:hidden;width:100%;height:100%;user-select:none;-webkit-user-select:none;" class="bg-[#CFEFFB] text-[#123B6D] overflow-hidden m-0 p-0 w-full h-full select-none">
    <div id="root" class="w-full h-full" style="width:100%;height:100%;background-color:#CFEFFB;">
      <div style="position:fixed;inset:0;background:linear-gradient(180deg,#FBFBEF 0%,#CFEFFB 18%,#A9E2F8 45%,#D9F3F1 62%,#F4FAEC 100%);pointer-events:none;"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
