<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <path d="M85 0v512 M170 0v512 M256 0v512 M341 0v512 M426 0v512 M0 85h512 M0 170h512 M0 256h512 M0 341h512 M0 426h512" stroke="#10b981" stroke-width="2" opacity="0.15" />

  <!-- Target corner brackets -->
  <g stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M128 160h-32v-32" />
    <path d="M384 128h32v32" />
    <path d="M96 352v32h32" />
    <path d="M416 352v32h-32" />
  </g>

  <!-- Open Book at bottom -->
  <path d="M256 318c-33-19-85-19-122-5v62c37-14 89-14 122 5 33-19 85-19 122-5v-62c-37-14-89-14-122 5z" fill="#1e293b" stroke="#10b981" stroke-width="8" stroke-linejoin="round" />
  <path d="M256 318v67" stroke="#10b981" stroke-width="8" />

  <!-- Holographic 3D Isometric Cube -->
  <!-- Top Face -->
  <polygon points="256,152 322,185 256,218 190,185" fill="#34d399" />
  <!-- Left Face -->
  <polygon points="190,185 256,218 256,285 190,252" fill="#059669" />
  <!-- Right Face -->
  <polygon points="322,185 256,218 256,285 322,252" fill="#10b981" />

  <!-- Cube Outlines & Edges -->
  <polygon points="256,152 322,185 322,252 256,285 190,252 190,185" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
  <line x1="256" y1="218" x2="256" y2="285" stroke="#ffffff" stroke-width="6" />
  <line x1="256" y1="218" x2="190" y2="185" stroke="#ffffff" stroke-width="6" />
  <line x1="256" y1="218" x2="322" y2="185" stroke="#ffffff" stroke-width="6" />

  <!-- Hologram Projection Rays -->
  <line x1="180" y1="322" x2="190" y2="252" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="6,6" opacity="0.7" />
  <line x1="332" y1="322" x2="322" y2="252" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="6,6" opacity="0.7" />
  <line x1="256" y1="318" x2="256" y2="285" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="6,6" opacity="0.7" />

  <!-- Sparkle at apex -->
  <polygon points="256,134 261,146 274,151 261,156 256,168 251,156 238,151 251,146" fill="#ffffff" />
</svg>
